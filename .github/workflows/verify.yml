name: Verify plugin manifest

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PHP for controller tests
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Build and verify manifest
        shell: pwsh
        run: .\src\waz-dashboard-plugin\tests\verify.ps1
